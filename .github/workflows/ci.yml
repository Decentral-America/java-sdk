name: CI

on:
  push:
    branches: [main, "feat/**", "fix/**", "chore/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Test (Java ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: [11, 17, 21]

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Java ${{ matrix.java }}
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          java-version: ${{ matrix.java }}
          distribution: temurin
          cache: maven

      - name: Verify (skip GPG + Sigstore)
        run: |
          mvn -B verify \
            -Dgpg.skip=true \
            -Dsigstore.skip=true \
            -Dmaven.javadoc.skip=false \
            -Djacoco.line.ratio=0.70 \
            -Djacoco.branch.ratio=0.60

      - name: Publish Surefire report
        if: always()
        uses: scacap/action-surefire-report@v1
        with:
          check_name: Test Report (Java ${{ matrix.java }})
          fail_on_test_failures: true

      - name: Upload coverage report
        if: matrix.java == 11
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: jacoco-report
          path: target/site/jacoco/
          retention-days: 14
